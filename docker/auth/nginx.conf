server {
    listen 8021;
    server_name 127.0.0.1;
    access_log off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    location ~ ^/(\.well-known(/|$)|auth(/|$)|token(/|$)|me(/|$)|jwks(/|$)|interaction(/|$)|session(/|$)|request(/|$)) {
        proxy_pass http://auth:8020;
    }
    # Only the interaction UI and its public dependencies reach Next.js.
    location ~ ^/(identity-login/?$|forgot-password/?$|reset-password/?$|_next/|favicon\.ico$|api/system/?$|api/oss/system/|api/v1/password/(forgot|verify-token|reset)/?$) {
        proxy_pass http://host.docker.internal:3000;
    }
    location / { return 404; }
}
