services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    # image: node:22-alpine
    container_name: ragent-web-dev
    working_dir: /app
    command: "sh -c 'pnpm install --force --frozen-lockfile=false && pnpm dev'"
    ports:
      - "3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ..:/app:cached
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: development
    env_file:
      - ../.env
    tty: true
    stdin_open: true
    networks:
      - ragent-service

  markdown-to-pdf:
    image: squarezw/markdown-to-pdf
    container_name: ragent-markdown-to-pdf-dev
    restart: unless-stopped
    ports:
      - "3005:3000"
    networks:
      - ragent-service

  onlyoffice:
    image: onlyoffice/documentserver
    container_name: ragent-onlyoffice-dev
    restart: unless-stopped
    ports:
      - "8443:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-onlyoffice-dev-secret}
      - PLUGINS_ENABLED=false
    entrypoint: ["/usr/local/bin/add-custom-fonts.sh"]
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_lib:/var/lib/onlyoffice
      - onlyoffice_logs:/var/log/onlyoffice
      - ./onlyoffice/add-custom-fonts.sh:/usr/local/bin/add-custom-fonts.sh:ro
      - ./onlyoffice/fonts:/usr/share/fonts/custom:ro
    networks:
      - ragent-service

  kkfileview:
    image: squarezw/kkfileview:v4.4.0
    container_name: kkfileview-dev
    restart: unless-stopped
    ports:
      - "8012:8012"
    environment:
      # 信任站点走 .env（需包含 OSS/COS 的文件下载域名，否则预览被拒）
      - KK_TRUST_HOST=${KK_TRUST_HOST:-web,localhost,127.0.0.1,0.0.0.0}
      - KK_NOT_TRUST_HOST=
      - KK_OFFICE_PREVIEW_TYPE=pdf
      - KK_OFFICE_PREVIEW_SWITCH_DISABLED=true
      - WATERMARK_TXT=ragents.dev
    networks:
      - ragent-service

volumes:
  node_modules:
  onlyoffice_data:
  onlyoffice_lib:
  onlyoffice_logs:

networks:
  ragent-service:
    name: ragent-service
    external: true
