# 生产部署 overlay —— 给客户用
#
# 用法:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d
#
# 跟 docker-compose.dev.yml 的区别：
# - 不 bind-mount 源码 → 镜像里的 PyArmor 加密版本真正生效
# - 强制挂载 license.lic 和 /etc/machine-id → license 校验必过才能起服务
# - 不开 uvicorn --reload → 沿用 Dockerfile CMD 的生产配置
#
# 前置：
# 1. host 上 /opt/ragent/license.lic 已就位（见 deploy/LICENSE_INSTALL.md）
# 2. /etc/machine-id 存在（绝大多数 Linux 默认有）
# 3. 镜像已 pull 或 build 完成
#    若客户没有内网 registry 访问权限，需在 .env 设 RAGENT_SERVICE_IMAGE 指向自有 registry，
#    或先 docker load 接收 tarball 后修改下方 image 字段。

services:
  ragent-service:
    # volumes list 不能在多个 compose 文件之间合并，必须整段重写
    volumes:
      # 上传文件持久化
      - ../uploads:${FILE_STORAGE_PREFIX}
      # 模型缓存
      - ./data/models:/app/model_cache
      # HuggingFace 缓存（首次启动会下载模型，挂出来避免重启重复下载）
      - ${HUGGINGFACE_CACHE_DIR}:/root/.cache/huggingface
      # ModelScope 缓存（Fun-ASR 等中文模型）
      - ${MODELSCOPE_CACHE_DIR}:/root/.cache/modelscope
      # 企微配置（不需要企微功能可注释）
      - ../${WECHAT_AGENTS_CONFIG_FILE}:/app/${WECHAT_AGENTS_CONFIG_FILE}:ro

      # ─── License（生产必需）───────────────────────────
      # license.lic 跟当前 host 的 machine-id 绑定。如果换 host，原 license 无效，
      # 需要重新提交 HWID 申请新 license。详见 deploy/LICENSE_INSTALL.md
      - /etc/machine-id:/etc/host-machine-id:ro
      - /opt/ragent/license.lic:/app/license.lic:ro

      # ─── Docker socket（execute_skill 起 skill 沙箱用）────────
      - /var/run/docker.sock:/var/run/docker.sock

      # ─── Skill 沙箱的三个目录根（**两侧同路径**）──────────────
      # skill 容器由宿主机 daemon 启动，`docker run -v A:B` 的 A 是**宿主机**路径。
      # 这三个目录必须在宿主机上真实存在且与本容器内容一致，否则 daemon 会现建
      # 同名空目录：skill 挂到空的 /skill、产物落进读不到的孤儿目录（生产实测）。
      # 两侧写成同一路径是刻意的——host_paths.py 虽能翻译，但同路径最不容易出错。
      # env 里要配套 SKILL_WORK_BASE / SKILL_MATERIALIZE_BASE / SKILL_STATE_BASE。
      - /var/lib/ragent/skill/work:/var/lib/ragent/skill/work
      - /var/lib/ragent/skill/materialize:/var/lib/ragent/skill/materialize
      - /var/lib/ragent/skill/state:/var/lib/ragent/skill/state
